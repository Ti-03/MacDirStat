name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: build-and-test only reads the repo. Without this block
# the job gets the default token, which can write contents.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 ships Xcode 16 (Swift 6.1): exercises the older-SDK fallback
        # compile path. macos-26 ships Xcode 26 (Swift 6.2): the real shipping
        # toolchain, with the macOS 26 SDK and Liquid Glass. The app uses
        # MeshGradient (macOS 15) and glassEffect (macOS 26), so it needs the
        # macOS 15+ SDK to compile, macos-14 cannot build it.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ matrix.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ matrix.os }}-spm-

      # Static-analysis gate: the Swift compiler (with StrictConcurrency enabled
      # in Package.swift) type-checks and concurrency-checks all production code.
      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

  # Prose gate: Vale lints the docs against the Microsoft style guide. A style
  # violation fails the build, so it never reaches a reviewer. Runs on Linux
  # (no Xcode needed) so it starts fast and in parallel with the build matrix.
  prose-lint:
    name: Docs prose (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          VALE_VERSION=3.15.1
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz vale
          sudo install vale /usr/local/bin/vale
          rm -f vale vale.tar.gz

      # Downloads the Microsoft style package declared in .vale.ini.
      - name: Sync Vale styles
        run: vale sync

      - name: Lint docs prose
        run: vale guide docs/adr README.md
